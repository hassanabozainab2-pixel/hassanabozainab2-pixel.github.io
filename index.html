*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#eaf7f0,#f7fbf8 55%,#fff);color:#173c30;display:grid;place-items:center;padding:22px}
.card{width:min(100%,460px);background:#fff;border:1px solid #dcebe3;border-radius:26px;padding:30px 24px;text-align:center;box-shadow:0 18px 55px #174b3518}
.logo{width:74px;height:74px;margin:0 auto 16px;border-radius:23px;background:#126b4d;color:white;display:grid;place-items:center;font-size:34px}
h1{font-size:25px;margin:8px 0 12px;color:#126b4d}p{font-size:16px;line-height:1.9;color:#587166;margin:0 0 22px}
.btn{display:block;text-decoration:none;background:#126b4d;color:white;padding:16px 18px;border-radius:15px;font-size:18px;font-weight:bold}

<body>

</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const id=params.get('business');
 const heading=document.getElementById('heading');
 const desc=document.getElementById('description');

 const target=location.origin+'/?business='+encodeURIComponent(id||'');
 btn.href=target;
 if(id==='ffa532c9-e7a5-45ff-bf07-910361de3a00'){
   heading.textContent='البدوي — بقالة';
   desc.textContent='شاهد منتجات وعروض البدوي في إسنا، شارع أحمد عرابي، وتواصل مباشرة مع المحل.';
   btn.textContent='اضغط هنا لمشاهدة عروض البدوي';
   document.title='اضغط هنا لمشاهدة عروض البدوي | جنب بيتك';
 }
})();
</script>
