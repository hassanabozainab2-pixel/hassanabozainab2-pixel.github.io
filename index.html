<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#126b4d">
<title>جنب بيتك | عروض المحلات</title>
<meta name="description" content="شاهد صفحة المحل وعروضه أو افتح تطبيق جنب بيتك.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="جنب بيتك">
<meta property="og:title" content="شاهد عروض المحل على جنب بيتك">
<meta property="og:description" content="صفحة المحل والمنتجات ووسائل التواصل — جنب بيتك">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#eaf7f0,#f7fbf8 55%,#fff);color:#173c30;display:grid;place-items:center;padding:22px}
.card{width:min(100%,460px);background:#fff;border:1px solid #dcebe3;border-radius:26px;padding:30px 24px;text-align:center;box-shadow:0 18px 55px #174b3518}
.logo{width:74px;height:74px;margin:0 auto 16px;border-radius:23px;background:#126b4d;color:white;display:grid;place-items:center;font-size:34px}
h1{font-size:25px;margin:8px 0 12px;color:#126b4d}p{font-size:16px;line-height:1.9;color:#587166;margin:0 0 22px}
.btn{display:block;text-decoration:none;padding:16px 18px;border-radius:15px;font-size:17px;font-weight:bold;margin-top:12px}
.primary{background:#126b4d;color:white}.secondary{background:#edf6f1;color:#126b4d;border:1px solid #cfe4d8}
.note{font-size:13px;margin-top:20px;color:#82958c}
</style>
</head>
<body>
<main class="card">
<div class="logo">🏪</div>
<h1 id="heading">افتح صفحة العميل على جنب بيتك</h1>
<p id="description">اختار: شاهد صفحة العميل ومنتجاته، أو اذهب إلى تطبيق جنب بيتك.</p>
<a class="btn primary" id="customerLink" href="#">اضغط هنا لمشاهدة عروض العميل</a>
<a class="btn secondary" id="appLink" href="https://hassanabozainab2-pixel.github.io/">اذهب إلى التطبيق</a>
<div class="note">جنب بيتك — كل الخدمات والعروض جنب بيتك ❤️</div>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const id=params.get('business')||'';
 const customerLink=document.getElementById('customerLink');
 const appLink=document.getElementById('appLink');
 const heading=document.getElementById('heading');
 const desc=document.getElementById('description');
 if(id){
   customerLink.href='https://qedaojphnxwoptitfzzk.supabase.co/functions/v1/janb-app?business='+encodeURIComponent(id);
 } else {
   customerLink.href='https://qedaojphnxwoptitfzzk.supabase.co/functions/v1/janb-app';
 }
 appLink.href='https://hassanabozainab2-pixel.github.io/';
 if(id==='ffa532c9-e7a5-45ff-bf07-910361de3a00'){
   heading.textContent='البدوي — بقالة';
   desc.textContent='إسنا — شارع أحمد عرابي. اختار مشاهدة صفحة البدوي أو فتح تطبيق جنب بيتك.';
   customerLink.textContent='اضغط هنا لمشاهدة عروض البدوي';
   document.title='البدوي | جنب بيتك';
   // افتح صفحة النشاط مباشرة بدل خطوة وسيطة إضافية.
   setTimeout(()=>window.location.replace(customerLink.href),120);
 }
})();
</script>
</body>
</html>
